<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeonNet — City Web</title><meta name="theme-color" content="#07060d">
<style>
:root{--bg:#07060d;--pan:#11101c;--line:#262338;--txt:#ecebf5;--mut:#9895b0;--acc:#ff2e88;--acc2:#20e3ff;--ok:#3dff9a;--gold:#ffc83d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 70% -10%,#2a0f3a55,transparent),radial-gradient(900px 500px at 0% 110%,#0a3a4a44,transparent),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.chrome{position:sticky;top:0;z-index:20;background:#0c0b15ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
.chrome .nav{background:var(--pan);border:1px solid var(--line);border-radius:8px;width:36px;height:36px}
.addr{flex:1;min-width:0;background:#05040a;border:1px solid var(--line);border-radius:18px;padding:8px 14px;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr b{color:var(--acc2);font-weight:600}
.wallet{background:#0b1f14;border:1px solid #1d5a3a;color:var(--ok);border-radius:8px;padding:7px 10px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet.hit{animation:hit .6s}@keyframes hit{30%{color:#ff4d6d;transform:scale(1.08)}}
.marks{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:#0a0912}
.marks button{background:none;border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:13px;color:var(--mut);white-space:nowrap}
.marks button.on{color:#fff;border-color:var(--c,var(--acc));box-shadow:0 0 10px -2px var(--c,var(--acc))}
main{max-width:1100px;margin:0 auto;padding:16px}
/* ad tower */
.tower{position:relative;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
.tower .grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0006 3px 4px),repeating-linear-gradient(90deg,#0000 0 3px,#0004 3px 4px);pointer-events:none;z-index:3}
.ad{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;opacity:0;transform:translateY(30px) scale(1.03);transition:opacity .8s,transform .8s;background:var(--g)}
.ad.on{opacity:1;transform:none}
.ad h3{margin:0;font-size:clamp(22px,4.5vw,40px);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 18px var(--gl)}
.ad p{margin:4px 0 0;font-size:14px;opacity:.9}
.ad .big{font-size:clamp(34px,8vw,70px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 24px var(--gl),0 0 2px #fff;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.75}}
.ad .sweep{position:absolute;inset:0;background:linear-gradient(100deg,#0000 40%,#fff3 50%,#0000 60%);background-size:250% 100%;animation:sw 3s linear infinite}
@keyframes sw{from{background-position:150% 0}to{background-position:-100% 0}}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4}
.dots i{width:18px;height:3px;background:#fff4;border-radius:2px}.dots i.on{background:#fff}
.tower.slim{height:84px}.tower.slim .ad{padding:0 18px}.tower.slim .ad h3{font-size:clamp(16px,3vw,24px)}.tower.slim .ad .big{font-size:clamp(22px,5vw,36px)}.tower.slim .ad p{display:none}
/* portal */
.hero{text-align:center;padding:26px 0 12px}
.logo{font-size:clamp(38px,8vw,64px);font-weight:900;letter-spacing:.02em;margin:0;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #ff2e8866)}
.hero p{color:var(--mut);margin:4px 0 16px}
.search{display:flex;max-width:560px;margin:0 auto;background:#05040a;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.search input{flex:1;background:none;border:0;color:#fff;padding:12px 18px;font:inherit;outline:none}
.search button{background:var(--acc);border:0;padding:0 18px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:22px 0}
.tile{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none;box-shadow:0 8px 30px -10px var(--c)}
.tile svg{width:100%;height:110px}
.tile h4{margin:8px 0 2px;font-size:19px;color:var(--c)}.tile p{margin:0;color:var(--mut);font-size:14px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.twin{grid-template-columns:1fr}}
/* shop */
.shophead{display:flex;align-items:center;gap:12px;margin:14px 0}
.shophead h2{margin:0;font-size:clamp(24px,5vw,34px);font-weight:900;font-style:italic;letter-spacing:.03em;color:var(--c);text-shadow:0 0 18px var(--c)}
.shophead span{color:var(--mut);font-size:14px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/8;background:var(--stagebg,linear-gradient(#15121f,#0a0910 70%,#16131f))}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#0000,#0008),repeating-linear-gradient(90deg,#ffffff08 0 1px,#0000 1px 60px)}
.stage svg.v{position:absolute;left:50%;bottom:8%;width:min(80%,640px);transform:translateX(-50%);overflow:visible;transition:filter .3s}
.stage .light{position:absolute;top:-20%;left:50%;width:60%;height:110%;transform:translateX(-50%);background:radial-gradient(ellipse at top,#ffffff18,transparent 65%);pointer-events:none}
.bounce{animation:bn .5s ease-in-out infinite alternate}@keyframes bn{to{transform:translate(-50%,-18px)}}
.hop{animation:hp 1s infinite}@keyframes hp{0%,100%{transform:translateX(-50%)}20%{transform:translate(-50%,-30px) rotate(-3deg)}40%{transform:translateX(-50%)}}
.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}@media(max-width:820px){.layout{grid-template-columns:1fr}}
.menu{background:#0c0b14;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.menu .mh{background:var(--c);color:#000;padding:10px 14px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.menu .mh small{font-weight:600;opacity:.7}
.menu ul{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto}
.menu li button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid #1a1828;padding:11px 14px;text-align:left}
.menu li button .pr{color:var(--mut);font-variant-numeric:tabular-nums}
.menu li button.sel{background:#fff;color:#000}.menu li button.sel .pr{color:#000}
.menu li button .tick{color:var(--ok);font-weight:900}
.menu li button.sel .tick{color:#08803f}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-2px;border:1px solid #fff5}
.menu .mf{padding:8px 14px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
.side{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.side h4{margin:0;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;justify-content:space-between;font-size:14px;gap:8px}.row span:last-child{font-variant-numeric:tabular-nums}
.total{font-size:22px;font-weight:900;border-top:1px solid var(--line);padding-top:10px}
.buy{background:var(--c);color:#000;border:0;border-radius:10px;padding:14px;font-weight:900;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.buy:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px}
.help{font-size:13px;color:var(--mut)}
.owned{font-size:13px;color:var(--mut)}.owned b{color:var(--txt)}
/* buy overlay */
.ov{position:fixed;inset:0;z-index:50;background:#000d;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.ovs{position:relative;width:min(94vw,820px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(#141220,#07060c);border:1px solid var(--line)}
.ovs svg.v{position:absolute;left:50%;bottom:12%;width:62%;transform:translateX(-50%);overflow:visible}
.door{position:absolute;inset:0;z-index:5;background:repeating-linear-gradient(#3a3946 0 22px,#24232d 22px 26px);transition:transform 1.6s cubic-bezier(.6,0,.3,1)}
.door.up{transform:translateY(-100%)}
.door.l,.door.r{width:50%;background:repeating-linear-gradient(90deg,#3b4048 0 30px,#2a2e35 30px 33px)}.door.r{left:50%}
.door.l.up{transform:translateX(-100%)}.door.r.up{transform:translateX(100%)}
.curtain{position:absolute;inset:0;z-index:5;background:linear-gradient(90deg,#3d0a1e,#6a1235,#3d0a1e);transition:transform 1.6s cubic-bezier(.6,0,.3,1)}.curtain.up{transform:translateY(-102%)}
.turn{position:absolute;left:50%;bottom:6%;width:70%;height:16%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#3a3550,#16141f);box-shadow:0 0 40px var(--c)}
.spin{animation:spin 1.4s ease-in-out 2}@keyframes spin{50%{transform:translateX(-50%) scaleX(-1)}}
.taxi{animation:taxi 3s ease-in forwards}@keyframes taxi{to{transform:translateX(120%) translateY(-60%) rotate(-12deg)}}
.drop{animation:drop 2.4s cubic-bezier(.3,.6,.4,1) forwards}@keyframes drop{from{transform:translate(-50%,-160%)}85%{transform:translate(-50%,4%)}to{transform:translateX(-50%)}}
.chute{position:absolute;left:50%;top:0;width:30%;transform:translate(-50%,-160%);z-index:2;animation:chute 2.4s cubic-bezier(.3,.6,.4,1) forwards}@keyframes chute{85%{transform:translate(-50%,10%);opacity:1}to{transform:translate(-40%,-40%);opacity:0}}
.spot{position:absolute;top:0;width:40%;height:100%;background:radial-gradient(ellipse at top,#fff3,transparent 70%);animation:spot 2s ease-in-out infinite alternate}@keyframes spot{from{left:0}to{left:60%}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd36b;box-shadow:0 0 6px #ffae00;z-index:6;animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y));opacity:0}}
.smoke{position:absolute;bottom:10%;width:80px;height:80px;border-radius:50%;background:radial-gradient(#9998,#0000 70%);z-index:4;animation:sm 2.2s ease-out forwards}@keyframes sm{from{transform:scale(.3);opacity:.8}to{transform:translateY(-120px) scale(3);opacity:0}}
.banner{position:absolute;left:0;right:0;top:8%;z-index:8;text-align:center;padding:14px;background:linear-gradient(90deg,#0000,#000c 20%,#000c 80%,#0000);transform:scaleY(0);transition:transform .35s}
.banner.on{transform:none}
.banner h3{margin:0;font-size:clamp(26px,6vw,48px);font-weight:900;font-style:italic;color:var(--gold);text-shadow:0 0 20px #ffb300a0;letter-spacing:.04em}
.banner p{margin:4px 0 0;color:#ff6b88;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.ovclose{position:absolute;right:10px;top:10px;z-index:9;background:#000a;border:1px solid #fff3;border-radius:8px;padding:6px 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a0d17;border:1px solid #ff4d6d;color:#ffd0d9;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .3s}.toast.on{opacity:1}
footer{color:var(--mut);font-size:12px;text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div class="chrome"><button class="nav" id="back" aria-label="Back">‹</button><button class="nav" id="home" aria-label="Home">⌂</button><div class="addr" id="addr"></div><div class="wallet" id="wallet" title="Your play money"></div></div>
<nav class="marks" id="marks"></nav>
<main id="app"></main>
<footer>NeonNet is a fan-made pretend city web. All money is fake. Not affiliated with any game company.</footer>
<div class="ov" id="ov"><div class="ovs" id="ovs"></div></div><div class="toast" id="toast"></div>
<script src="app.js"></script></body></html>
